[package]
name = "nm_runtimes"
version = "0.1.0"
edition = "2021"
description = "NextMON Server runtime manager (PHP + Node.js) for Windows x64"
license = "MIT"

[lib]
name = "nm_runtimes"
path = "src/lib.rs"

[[example]]
name = "rt"
path = "examples/rt.rs"

[dependencies]
futures-util = "0.3.34"
hex = "0.4.3"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "stream", "gzip"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "fs", "process", "time", "sync", "io-util"] }
zip = { version = "9.2.1", default-features = false, features = ["deflate"] }

[dev-dependencies]
tempfile = "3.27.0"

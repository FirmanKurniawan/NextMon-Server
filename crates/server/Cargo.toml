[package]
name = "nextmon-server"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "NextMON Server - tray launcher, process supervisor and control panel for NextMON"
build = "build.rs"

[lib]
name = "nextmon_server"
path = "src/lib.rs"

[[bin]]
name = "nextmon-server"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "io-util", "fs", "sync", "time", "net", "signal"] }
tokio-stream = "0.1"
nm_runtimes = { path = "../runtimes" }
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "json", "query"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zip = { version = "9", default-features = false, features = ["deflate"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json", "stream"] }
futures-util = "0.3"
sha2 = "0.11"
log = { version = "0.4", features = ["std"] }
getrandom = "0.2"
rust-embed = "8"
tray-icon = { version = "0.26", default-features = false }
tao = "0.37"
wry = "0.57"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
  "Win32_Foundation", "Win32_System_Threading", "Win32_System_JobObjects", "Win32_System_Console",
  "Win32_System_SystemInformation", "Win32_System_Registry", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging",
  "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_ProcessStatus", "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_Memory", "Win32_NetworkManagement_IpHelper", "Win32_Networking_WinSock",
] }

[build-dependencies]
winres = "0.1"

[dev-dependencies]
tempfile = "3"

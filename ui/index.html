<!doctype html>
<html lang="id" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <!-- The Rust server replaces the placeholder with the real control token when serving this file. -->
  <meta name="nm-token" content="{{NM_TOKEN}}">
  <title>NextMON Server</title>
  <link rel="icon" type="image/svg+xml" href="assets/mark-tile.svg">
  <link rel="stylesheet" href="assets/css/panel.css">
  <script src="assets/js/boot.js"></script>
</head>
<body>
  <div class="bg" aria-hidden="true"></div>
  <a class="skip" href="#main" id="skip">Skip to content</a>
  <div class="app">
    <aside class="sidebar glass" id="sidebar" aria-label="Navigasi">
      <a class="brand" href="#/dashboard"><img src="assets/mark-tile.svg" alt="" width="28" height="28"><span>NextMON<small>Server</small></span></a>
      <nav id="nav"></nav>
      <div class="sb-foot"><span class="conn" id="conn"></span><span id="sb-ver">—</span></div>
    </aside>
    <div class="scrim" id="scrim"></div>
    <div class="shell">
      <header class="topbar glass">
        <button class="btn btn-ghost btn-icon menu-btn" id="menu-btn" type="button" aria-controls="sidebar" aria-expanded="false"></button>
        <span class="tb-brand"><img src="assets/mark-tile.svg" alt="" width="24" height="24"></span>
        <a id="tb-status" class="tb-status" href="#/dashboard"></a>
        <span class="spacer"></span>
        <div id="tb-tools" class="row"></div>
      </header>
      <div class="banners" id="banners"></div>
      <main class="content" id="main" tabindex="-1"></main>
    </div>
  </div>
  <noscript><p style="padding:16px">This panel needs JavaScript.</p></noscript>
  <script type="module" src="assets/js/main.js"></script>
</body>
</html>
